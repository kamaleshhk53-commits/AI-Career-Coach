{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Register | AI Career Coach</title>
    <link rel="stylesheet" href="{% static 'career/css/style.css' %}?v=6">
</head>

<body class="upload-page">

    <div class="upload-container">

        <h1>Create Account</h1>

        <p>Join AI Career Coach and improve your career.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>

</body>
</html>
