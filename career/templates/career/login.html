{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Login | AI Career Coach</title>
    <link rel="stylesheet" href="{% static 'career/css/style.css' %}?v=6">
</head>

<body class="upload-page">

    <div class="upload-container">

        <h1>Welcome Back</h1>

        <p>Login to your AI Career Coach account.</p>

        {% if form.errors %}
            <p style="color: red;">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Register here</a>
        </p>

    </div>

</body>
</html>
